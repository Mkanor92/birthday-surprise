<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#710b25"><title>A surprise for you ❤️</title><style>
:root{--wine:#710b25;--red:#bd2048;--pink:#ffe5eb;--gold:#f3cf83;--ink:#421421}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#ffe0e8,#fff9f7 60%);color:var(--ink);font-family:Georgia,serif;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:18px 14px 45px}.top{display:flex;justify-content:space-between;align-items:center;font:700 11px system-ui;letter-spacing:.16em;color:var(--wine)}.tag{border:1px solid #e9bac5;background:#fff9;padding:7px 10px;border-radius:30px;letter-spacing:0}.bar{height:4px;background:#f0cbd4;margin:20px 0;border-radius:9px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#e45a7c,#710b25);transition:.4s}.panel{background:#ffffffdf;border:1px solid #f0c4ce;border-radius:28px;padding:clamp(20px,5vw,42px);box-shadow:0 22px 60px #6e0b2017;min-height:450px}.k{font:700 11px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#b34b65}.h{font-size:clamp(34px,7vw,58px);line-height:1.04;color:var(--wine);margin:12px 0}.p{font:15px/1.7 system-ui;color:#805461}.btn{border:0;border-radius:30px;padding:13px 21px;background:linear-gradient(135deg,#d22b55,#710b25);color:white;font:700 13px system-ui;cursor:pointer;box-shadow:0 8px 22px #a40e3325}.btn.alt{background:white;color:var(--wine);border:1px solid #e9bdc7;box-shadow:none}.btn.gold{background:linear-gradient(135deg,#f7dc9b,#d5a53d);color:#4a1721}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}.field{margin:14px 0}.field label{display:block;font:700 12px system-ui;color:#77243b;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid #e8bdc7;border-radius:12px;padding:12px;font:14px system-ui;color:#421421}.field textarea{min-height:85px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hide{display:none!important}.seal{width:105px;height:105px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d42b55,#65081f);color:white;font-size:48px;margin:24px auto;box-shadow:0 12px 30px #780b2935}.photo{max-width:440px;margin:20px auto;padding:9px;background:white;box-shadow:0 12px 30px #78102a22;transform:rotate(-1deg)}.photo img{display:block;width:100%;max-height:340px;object-fit:cover}.caption{text-align:center;padding:12px;font-style:italic;color:#8c3049}.balloons{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:440px;margin:24px auto}.balloon{height:145px;position:relative;border:0;background:transparent;cursor:pointer}.balloon:before{content:'';position:absolute;inset:0 12% 16%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffb8ca,#c51d49 60%,#6c0927);box-shadow:inset -9px -10px 15px #51051e44,0 10px 20px #8c0a2c22}.balloon:nth-child(2):before{background:radial-gradient(circle at 30% 25%,#ffd4df,#d94b72 60%,#891036)}.balloon:nth-child(3):before{background:radial-gradient(circle at 30% 25%,#ffe8b8,#c48a37 60%,#75481d)}.balloon:nth-child(4):before{background:radial-gradient(circle at 30% 25%,#f3c8e1,#a34d7c 60%,#612548)}.balloon:after{content:'';position:absolute;left:50%;bottom:0;height:25px;border-left:1px solid #bd8390}.balloon span{position:relative;color:white;text-shadow:0 1px 5px #4a0018;font:700 12px system-ui}.balloon.popped:before{animation:pop .35s forwards}.balloon.popped span{opacity:0}@keyframes pop{to{transform:scale(1.7);opacity:0}}.reveal{background:#fff0f3;border:1px solid #f1c5d0;border-radius:16px;padding:20px;text-align:center;font-size:17px;line-height:1.6;min-height:85px}.choice{display:flex;gap:10px;padding:13px;border:1px solid #e9c2cb;border-radius:14px;background:#fff;margin:10px 0;font:14px system-ui}.cake{text-align:center;font-size:95px;margin:20px}.candles{text-align:center;font-size:36px;letter-spacing:8px}.letter{white-space:pre-wrap;background:#fff1f4;border-radius:16px;padding:22px;font-size:17px;line-height:1.85}.heart{font-size:65px;text-align:center;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.15)}}.confetti{position:fixed;top:-15px;width:9px;height:14px;z-index:5;animation:fall 3.5s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}.small{font:12px/1.5 system-ui;color:#976d78}.foot{text-align:center;font:11px system-ui;color:#a16e7b;margin-top:18px}@media(max-width:540px){.two{grid-template-columns:1fr}.panel{border-radius:22px}.balloon{height:125px}}
</style></head><body><div class="wrap"><div class="top"><span>♡ A LITTLE LOVE STORY</span><span class="tag" id="tag">Birthday edition</span></div><div class="bar"><b id="bar"></b></div><main class="panel" id="app"></main><p class="foot">A handmade surprise · Best enjoyed with sound on ♡</p></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const D={name:'My love',from:'Your person',photo:'',caption:'One of my favourite memories with you.',notes:['You make ordinary days feel magical. I hope you never forget how loved you are.','If I could give you one gift, it would be the chance to see yourself through my eyes.','My favourite memories are the little ones: your laugh, your stories, and simply being near you.','I choose you in the little moments, the big moments, and all the moments still waiting for us.'],music:'romance',cake:'Red velvet ❤️',letter:'Happy Birthday, my love.\n\nI hope today reminds you how deeply you are loved. You make my world warmer just by being in it. I wish you a year filled with peace, brave new beginnings, unexpected happiness, and dreams coming true.\n\nI may not always find the perfect words, but I will always be grateful that our paths crossed. Here is to more laughter, more memories, more late-night conversations, and many beautiful chapters ahead.\n\nAll my love, always. ❤️'};
function enc(o){let a=new TextEncoder().encode(JSON.stringify(o)),s='';a.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function dec(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);let b=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))}catch(e){return null}}
let gift=dec(location.hash.slice(1)),data=gift||{...D,notes:[...D.notes]},stage=0,popped=[],audio=null;function progress(n){$('#bar').style.width=n/6*100+'%'}function show(h,n){$('#app').innerHTML=h;progress(n)}function party(){for(let i=0;i<65;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#c51e47','#f4c96c','#ef9bb0','#8b1740','#fff'][i%5];e.style.animationDelay=Math.random()+'s';document.body.append(e);setTimeout(()=>e.remove(),4500)}}
function stop(){if(audio){try{audio.close()}catch(e){}audio=null}}function music(t){stop();if(t==='silent')return;try{audio=new(window.AudioContext||window.webkitAudioContext)();let seq=t==='birthday'?[392,392,440,392,523,494,392,392,440,392,587,523]:t==='dream'?[261,329,392,523,392,329,293,349,440,392]:[261,329,392,440,392,329,293,349,392,523];seq.forEach((f,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=t==='dream'?'sine':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime+i*.38);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+i*.38+.04);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+i*.38+.33);o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+i*.38);o.stop(audio.currentTime+i*.38+.34)})}catch(e){alert('Tap play again to enable audio.')}}
async function compress(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),z=Math.min(1,640/Math.max(im.width,im.height));c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.62))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function creator(){ $('#tag').textContent='Create your surprise';show(`<div class="k">Your own romantic birthday page</div><h1 class="h">Make them feel<br>like the whole world.</h1><p class="p">Create a six-part surprise with a photo, four balloons to pop, music, cake and a love letter.</p><div class="seal">♥</div><p class="p" style="text-align:center">A little birthday adventure made just for them.</p><div class="row" style="justify-content:center"><button class="btn" id="start">Create my surprise →</button></div>`,0);$('#start').onclick=()=>build(0)}
function build(s){$('#tag').textContent='Personalise your surprise';if(s===0){show(`<div class="k">Creator · Step 1 of 5</div><h2 class="h">Who are we celebrating?</h2><div class="two"><div class="field"><label>Their name</label><input id="name" value="${esc(data.name)}" maxlength="60"></div><div class="field"><label>Your name / nickname</label><input id="from" value="${esc(data.from)}" maxlength="60"></div></div><div class="field"><label>Upload your favourite photo</label><input id="photo" type="file" accept="image/*"><p class="small">The photo is resized and included in the share link. Optional, but recommended.</p><img id="preview" class="photo ${data.photo?'':'hide'}" src="${data.photo}"></div><div class="field"><label>Photo caption</label><input id="caption" value="${esc(data.caption)}" maxlength="120"></div><button class="btn" id="next">Next: Four little notes →</button>`,1);$('#photo').onchange=async e=>{if(e.target.files[0]){data.photo=await compress(e.target.files[0]);$('#preview').src=data.photo;$('#preview').classList.remove('hide')}};$('#next').onclick=()=>{data.name=$('#name').value||'My love';data.from=$('#from').value||'Your person';data.caption=$('#caption').value;build(1)}}
else if(s===1){show(`<div class="k">Creator · Step 2 of 5</div><h2 class="h">Four balloons.<br>Four things to say.</h2><p class="p">Each balloon will burst when tapped and reveal one message.</p>${data.notes.map((x,i)=>`<div class="field"><label>Love note ${i+1}</label><textarea id="n${i}" maxlength="420">${esc(x)}</textarea></div>`).join('')}<div class="row"><button class="btn alt" id="back">← Back</button><button class="btn" id="next">Choose music →</button></div>`,2);$('#back').onclick=()=>build(0);$('#next').onclick=()=>{data.notes=data.notes.map((_,i)=>$('#n'+i).value);build(2)}}
else if(s===2){show(`<div class="k">Creator · Step 3 of 5</div><h2 class="h">Give the moment<br>a soundtrack.</h2><p class="p">Choose a browser-generated melody. No paid music files are needed.</p><label class="choice"><input type="radio" name="music" value="birthday" ${data.music==='birthday'?'checked':''}> Birthday sparkle — cheerful tune</label><label class="choice"><input type="radio" name="music" value="romance" ${data.music==='romance'?'checked':''}> Romantic piano — soft and warm</label><label class="choice"><input type="radio" name="music" value="dream" ${data.music==='dream'?'checked':''}> Emotional memories — dreamy notes</label><label class="choice"><input type="radio" name="music" value="silent" ${data.music==='silent'?'checked':''}> Quiet moment — no music</label><div class="row"><button class="btn alt" id="preview">▶ Preview</button><button class="btn alt" id="back">← Back</button><button class="btn" id="next">Choose cake →</button></div>`,3);$('#preview').onclick=()=>music(document.querySelector('[name=music]:checked').value);$('#back').onclick=()=>{stop();build(1)};$('#next').onclick=()=>{data.music=document.querySelector('[name=music]:checked').value;stop();build(3)}}
else if(s===3){show(`<div class="k">Creator · Step 4 of 5</div><h2 class="h">One cake, coming up.</h2><p class="p">Choose their birthday cake and write your final letter.</p>${['Red velvet ❤️','Chocolate 🍫','Strawberry 🍓','Vanilla 🌼','Black forest 🍒','Surprise me 🎁'].map(x=>`<label class="choice"><input type="radio" name="cake" value="${x}" ${data.cake===x?'checked':''}> ${x}</label>`).join('')}<div class="field"><label>Your birthday letter</label><textarea id="letter" style="min-height:170px">${esc(data.letter)}</textarea></div><div class="row"><button class="btn alt" id="back">← Back</button><button class="btn" id="next">Create share link →</button></div>`,4);$('#back').onclick=()=>build(2);$('#next').onclick=()=>{data.cake=document.querySelector('[name=cake]:checked')?.value||'Red velvet';data.letter=$('#letter').value;build(4)}}
else{let url=location.href.split('#')[0]+'#'+enc(data);show(`<div class="k">Creator · Step 5 of 5</div><h2 class="h">Your surprise is ready. 💌</h2><p class="p">Copy this personalized link and send it to your special person.</p><div class="photo">${data.photo?`<img src="${data.photo}">`:'<div style="padding:50px;text-align:center;font-size:65px">💞</div>'}<div class="caption">${esc(data.caption)}</div></div><div class="field"><label>Your personalized link</label><textarea id="share" readonly style="min-height:90px">${esc(url)}</textarea></div><p class="small">The photo and messages are encoded in the link, not encrypted. Anyone with the link can view them. Avoid private information.</p><div class="row"><button class="btn alt" id="back">← Edit</button><button class="btn" id="copy">Copy share link</button><button class="btn gold" id="test">Preview recipient journey →</button></div><p class="small" id="status"></p>`,5);$('#back').onclick=()=>build(3);$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);$('#status').textContent='Copied! Send it by WhatsApp or Instagram.'}catch(e){$('#share').select();$('#status').textContent='Copy the selected link.'}};$('#test').onclick=()=>{location.hash=enc(data);gift=data;stage=0;popped=[];recipient()}}}
function recipient(){$('#tag').textContent='A surprise for '+gift.name;if(stage===0){show(`<div style="text-align:center;padding:25px 0"><div class="k">Someone made this just for you</div><div class="seal">♥</div><h1 class="h">Happy Birthday,<br>${esc(gift.name)}.</h1><p class="p">A little surprise, made with a lot of love. Take your time and enjoy every moment.</p><button class="btn" id="go">Open your surprise →</button></div>`,1);$('#go').onclick=()=>{stage++;recipient()}}
else if(stage===1){show(`<div class="k">Chapter 1 · A memory</div><h2 class="h">A moment worth keeping.</h2>${gift.photo?`<div class="photo"><img src="${gift.photo}"><div class="caption">${esc(gift.caption)}</div></div>`:'<div class="seal">📸</div>'}<p class="p" style="text-align:center">Some moments become memories. Some people make those memories unforgettable.</p><button class="btn" id="go">Find the four balloons →</button>`,2);$('#go').onclick=()=>{stage++;recipient()}}
else if(stage===2){show(`<div class="k">Chapter 2 · Pop a little love</div><h2 class="h">Four balloons.<br>Tap to discover.</h2><p class="p">Each balloon is hiding a message. Tap all four to unlock the next surprise.</p><div class="balloons">${gift.notes.map((_,i)=>`<button class="balloon" data-i="${i}"><span>POP ME</span></button>`).join('')}</div><div class="reveal" id="reveal">Your first little note is waiting inside a balloon. 💗</div><p class="small" id="count" style="text-align:center">0 of 4 notes revealed</p><button class="btn" id="go" disabled>Continue →</button>`,3);document.querySelectorAll('.balloon').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;b.classList.add('popped');b.disabled=true;$('#reveal').textContent=gift.notes[i];popped.push(i);$('#count').textContent=popped.length+' of 4 notes revealed';party();if(popped.length===4)$('#go').disabled=false});$('#go').onclick=()=>{stage++;recipient()}}
else if(stage===3){let title={birthday:'Birthday sparkle',romance:'Romantic piano',dream:'Emotional memories',silent:'A quiet moment'}[gift.music];show(`<div class="k">Chapter 3 · A soundtrack</div><h2 class="h">A melody, just for you.</h2><div class="seal">♫</div><h2 style="text-align:center;color:var(--wine)">${title}</h2><p class="p" style="text-align:center">They picked this soundtrack while creating your surprise.</p><div class="row"><button class="btn" id="play">▶ Play melody</button><button class="btn alt" id="stop">■ Stop</button></div><button class="btn" id="go">Save me a slice →</button>`,4);$('#play').onclick=()=>music(gift.music);$('#stop').onclick=stop;$('#go').onclick=()=>{stop();stage++;recipient()}}
else if(stage===4){show(`<div class="k">Chapter 4 · Make a wish</div><h2 class="h">Your birthday wish is waiting.</h2><div class="cake">🎂</div><div class="candles" id="flames">🕯️ 🕯️ 🕯️</div><p class="p" style="text-align:center">Your cake flavour: <b>${esc(gift.cake)}</b></p><p class="p" style="text-align:center">Close your eyes, make a wish, then blow out the candles.</p><button class="btn gold" id="blow">Blow out candles ✨</button><p class="p" id="wish"></p><button class="btn" id="go" disabled>Read your letter →</button>`,5);$('#blow').onclick=()=>{$('#flames').textContent='✨ ✨ ✨';$('#wish').textContent='May this year bring you everything your heart is wishing for. ❤️';party();$('#go').disabled=false};$('#go').onclick=()=>{stage++;recipient()}}
else{show(`<div style="text-align:center"><div class="k">Chapter 5 · From ${esc(gift.from)}</div><div class="heart">❤️</div><h1 class="h">A letter for you,<br>${esc(gift.name)}.</h1><div class="letter">${esc(gift.letter)}</div><h2 class="h" style="font-size:32px">Happy Birthday, my love.</h2><p class="p">With all my love,<br><b>${esc(gift.from)}</b></p><button class="btn" id="again">Celebrate again ✨</button></div>`,6);party();$('#again').onclick=()=>{stage=0;popped=[];recipient()}}}
if(gift){data=gift;recipient()}else creator();
</script></body></html>
