<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#260d20"><title>A little love story ✦</title>
<style>
:root{--wine:#5d1739;--rose:#d85d83;--blush:#ffe4ec;--gold:#e9c27a;--ink:#321827;--cream:#fff9f5;--glass:#fffaf2cc}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:radial-gradient(ellipse at 18% 5%,#74304f 0,transparent 34%),radial-gradient(ellipse at 90% 15%,#4b2347 0,transparent 32%),linear-gradient(145deg,#170d20,#3a1832 55%,#1c1022);overflow-x:hidden}.sparkles{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff9 1px,transparent 1px),radial-gradient(#f5c9d9aa 1px,transparent 1px);background-size:73px 73px,113px 113px;background-position:0 0,32px 41px;opacity:.35}.wrap{position:relative;z-index:1;max-width:900px;margin:auto;padding:22px 15px 48px}.top{display:flex;justify-content:space-between;align-items:center;color:#ffe8ef;font:700 10px system-ui;letter-spacing:.22em}.tag{border:1px solid #eac1d477;background:#ffffff12;padding:8px 12px;border-radius:30px;letter-spacing:.04em}.bar{height:3px;background:#ffffff22;margin:20px 0;border-radius:8px;overflow:hidden}.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,#e99bb5,#f5d99b);transition:.5s}.panel{position:relative;overflow:hidden;background:linear-gradient(145deg,#fffdf9f5,#fff0f4f2);border:1px solid #f5d5df;border-radius:30px;padding:clamp(22px,5vw,48px);min-height:470px;box-shadow:0 30px 90px #09030b77, inset 0 1px #fff}.panel:before{content:"";position:absolute;inset:9px;border:1px solid #d6a2b477;border-radius:23px;pointer-events:none}.panel>*{position:relative}.k{font:700 10px system-ui;letter-spacing:.24em;text-transform:uppercase;color:#a04b6b}.h{font-size:clamp(36px,7vw,64px);line-height:1.02;color:#5b1739;margin:13px 0 16px;text-shadow:0 2px #fff}.p{font:15px/1.75 system-ui;color:#795568;max-width:660px}.btn{border:1px solid #7b244c;border-radius:30px;padding:13px 22px;background:linear-gradient(135deg,#8d315b,#4b1536);color:#fff;font:700 13px system-ui;cursor:pointer;box-shadow:0 10px 22px #55132e33, inset 0 1px #ffffff55;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px #55132e44}.btn.alt{background:#fff;color:#692344;border-color:#e5bdcb;box-shadow:0 5px 15px #6b214011}.btn.gold{background:linear-gradient(135deg,#f3dba2,#c18c3e);color:#43213a;border:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}.field{margin:16px 0}.field label{display:block;font:700 12px system-ui;color:#74294a;margin-bottom:7px}.field input:not([type=file]),.field textarea{width:100%;border:1px solid #e4bdca;border-radius:13px;padding:12px 14px;font:14px system-ui;color:#432033;background:#fff}.field textarea{min-height:90px;resize:vertical}.field input[type=file]{display:block;width:100%;font:13px system-ui;color:#69445a}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hide{display:none!important}.seal{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#f8b5cb,#a63867 58%,#50132f);color:white;font-size:48px;margin:25px auto;box-shadow:inset -8px -10px 16px #350d2c55,0 18px 32px #56102e55;border:2px solid #f7d9b6}.photo-frame{width:min(100%,520px);margin:24px auto 18px;padding:12px;background:linear-gradient(135deg,#fff,#f9e6d2 40%,#c79a60 52%,#fff0dc 65%,#fff);border-radius:8px;box-shadow:0 20px 35px #47172c2c, inset 0 0 0 1px #fff;transform:rotate(-.5deg)}.photo-inner{padding:7px;background:#fff;border:1px solid #d6b68a;box-shadow:inset 0 0 0 2px #f6e9d8}.photo-frame img{display:block;width:100%;height:clamp(190px,48vw,390px);object-fit:cover}.caption{text-align:center;padding:12px 8px 5px;font-style:italic;color:#8b4965}.gallery{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px auto}.gallery button{width:38px;height:38px;border-radius:50%;border:1px solid #e1b7c7;background:#fff;color:#78284d;font-size:19px;cursor:pointer}.dots{display:flex;justify-content:center;gap:7px}.dots i{width:7px;height:7px;border-radius:50%;background:#d7b4c1}.dots i.on{background:#8d315b;transform:scale(1.3)}.small{font:12px/1.55 system-ui;color:#9b7486}.choice{display:flex;gap:10px;align-items:center;padding:13px 14px;border:1px solid #e8cbd4;border-radius:14px;background:#fff;margin:10px 0;font:14px system-ui;color:#60334a}.choice input{accent-color:#8d315b}.balloons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:600px;margin:25px auto}.balloon{height:150px;position:relative;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 13px 9px #4d163322)}.balloon:before{content:'';position:absolute;inset:0 7% 15%;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 28% 22%,#ffe4ec,#e15a8c 42%,#74183e 88%);box-shadow:inset -11px -13px 17px #390b2d55,inset 5px 5px 10px #ffffff88}.balloon:nth-child(2):before{background:radial-gradient(circle at 28% 22%,#fff0d4,#d9a34f 45%,#80501e)}.balloon:nth-child(3):before{background:radial-gradient(circle at 28% 22%,#f4d8f2,#ad66a0 45%,#542a60)}.balloon:nth-child(4):before{background:radial-gradient(circle at 28% 22%,#fff0f5,#c94c6e 45%,#681a3b)}.balloon:after{content:'';position:absolute;left:50%;bottom:0;height:26px;border-left:1px solid #b27b91}.balloon span{position:relative;color:white;text-shadow:0 2px 6px #360a25;font:800 10px system-ui;letter-spacing:.1em}.balloon.popped:before{animation:pop .38s forwards}.balloon.popped span{opacity:0}@keyframes pop{to{transform:scale(1.65);opacity:0}}.reveal{background:linear-gradient(135deg,#fff,#fff0f4);border:1px solid #e9c5d1;border-radius:18px;padding:22px;text-align:center;font-size:17px;line-height:1.65;min-height:95px;box-shadow:inset 0 1px #fff,0 8px 20px #8c315018}.cake-stage{text-align:center;perspective:900px}.cake3d{font-size:108px;margin:22px auto 6px;filter:drop-shadow(0 16px 13px #5b183344);transform:rotateX(8deg);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotateX(8deg)}}.candles{font-size:36px;letter-spacing:8px}.letter-intro{text-align:center;margin:6px 0 15px}.envelope-scene{perspective:1100px;width:min(100%,510px);height:320px;margin:28px auto 10px;position:relative;display:grid;place-items:center}.envelope{position:absolute;bottom:22px;width:min(100%,460px);height:245px;filter:drop-shadow(0 22px 24px #4b142e40);transform-style:preserve-3d}.env-back{position:absolute;inset:0;background:linear-gradient(145deg,#dba2b5,#8d315b);border-radius:8px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.env-front{position:absolute;inset:0;background:linear-gradient(145deg,#f6d8df,#c97896);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%);border-radius:8px}.env-flap{position:absolute;top:0;left:0;width:100%;height:62%;background:linear-gradient(150deg,#f8dfe5,#ba6483);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1s cubic-bezier(.2,.75,.2,1);z-index:5;filter:drop-shadow(0 5px 3px #6d244155)}.env-heart{position:absolute;z-index:6;top:35%;left:50%;transform:translate(-50%,-50%);font-size:35px;transition:opacity .3s}.letter-card{position:absolute;z-index:3;bottom:34px;left:5%;width:90%;height:250px;overflow:auto;background:linear-gradient(145deg,#fffefb,#fff0f3);border:1px solid #e3c29b;box-shadow:0 8px 20px #4b142e22;padding:20px 19px;text-align:left;transform:translateY(0);transition:transform 1.1s cubic-bezier(.16,.8,.2,1),z-index 0s 0s;border-radius:4px}.letter-card:before{content:'✦  A LETTER FOR YOU  ✦';display:block;text-align:center;font:700 9px system-ui;letter-spacing:.2em;color:#a15a70;margin-bottom:12px}.letter-card .letter{white-space:pre-wrap;font:14px/1.75 Georgia,serif;color:#4b2a3b}.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}.envelope.open .env-heart{opacity:0}.envelope.open .letter-card{transform:translateY(-185px);z-index:8;transition:transform 1.1s cubic-bezier(.16,.8,.2,1),z-index 0s .5s}.confetti{position:fixed;top:-15px;width:8px;height:13px;z-index:9;animation:fall 3.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(760deg);opacity:0}}.foot{text-align:center;font:11px system-ui;color:#e8c4d2;margin-top:18px}.note{font:12px/1.55 system-ui;color:#9a7182}@media(max-width:620px){.two{grid-template-columns:1fr}.balloons{grid-template-columns:repeat(2,1fr);max-width:350px}.balloon{height:130px}.panel{border-radius:23px}.envelope-scene{height:300px}.letter-card{height:245px}.envelope.open .letter-card{transform:translateY(-155px)}}
</style></head><body><div class="sparkles"></div><div class="wrap"><div class="top"><span>✦ A LITTLE LOVE STORY ✦</span><span class="tag" id="tag">Birthday edition</span></div><div class="bar"><b id="bar"></b></div><main class="panel" id="app"></main><p class="foot">Made with love · Best experienced on a phone with sound on ♡</p></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT={name:'My love',from:'Your person',photos:[],caption:'One of my favourite memories with you.',notes:['I forgive you for every mistake and every misunderstanding. Loving you means understanding, forgiving, and choosing to move forward together.','I want to keep falling in love with you through every season of life, until our hair turns grey and we grow old together.','Your birthday is special to me because every year gives me another chance to celebrate you in a unique and beautiful way.','You are my happiness, my peace, and one of the most precious parts of my life. I am truly lucky to have you.'],musicData:'',musicName:'',cake:'Red velvet ❤️',letter:'Happy Birthday, my love.\n\nI hope today reminds you how deeply you are loved. You make my world warmer just by being in it. I wish you a year filled with peace, brave new beginnings, unexpected happiness, and dreams coming true.\n\nAll my love, always. ❤️'};
function encode(o){let bytes=new TextEncoder().encode(JSON.stringify(o)),bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decode(s){try{s=s.replace(/-/g,'+').replace(/_/g,'/');s+='==='.slice((s.length+3)%4);let b=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))))}catch(e){return null}}
let gift=decode(location.hash.slice(1)),data=gift||{...DEFAULT,photos:[],notes:[...DEFAULT.notes]},stage=0,popped=[],audio=null,photoIndex=0;
function progress(n){$('#bar').style.width=n/6*100+'%'}function show(html,n){$('#app').innerHTML=html;progress(n)}function confetti(){for(let i=0;i<75;i++){let e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.background=['#c65b83','#f0ce87','#f5a9c2','#8d315b','#fff'][i%5];e.style.animationDelay=Math.random()+'s';document.body.append(e);setTimeout(()=>e.remove(),4300)}}
function stopMusic(){if(audio){try{audio.pause();audio.currentTime=0}catch(e){}audio=null}}
function playMusic(){stopMusic();if(!gift.musicData){alert('No personal music was added to this surprise.');return}audio=new Audio(gift.musicData);audio.loop=true;audio.play().catch(()=>alert('Tap Play again to allow music in your browser.'))}
function compressPhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.52))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function readFile(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function renderGallery(){let p=data.photos||[];return p.length?`<div class="photo-frame"><div class="photo-inner"><img id="galleryPhoto" src="${p[0]}"><div class="caption" id="galleryCaption">${esc(data.caption)}</div></div></div><div class="gallery"><button id="prevPhoto" aria-label="Previous photo">‹</button><span class="small" id="photoCount">1 / ${p.length}</span><button id="nextPhoto" aria-label="Next photo">›</button></div><div class="dots">${p.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:`<div class="seal">♡</div>`}
function wireGallery(){let p=data.photos||[];if(!p.length)return;photoIndex=0;function set(i){photoIndex=(i+p.length)%p.length;$('#galleryPhoto').src=p[photoIndex];$('#photoCount').textContent=(photoIndex+1)+' / '+p.length;document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===photoIndex))}$('#prevPhoto').onclick=()=>set(photoIndex-1);$('#nextPhoto').onclick=()=>set(photoIndex+1)}
function creator(){ $('#tag').textContent='Create your surprise';show(`<div class="k">A keepsake made just for them</div><h1 class="h">Make their birthday<br>feel unforgettable.</h1><p class="p">A romantic six-part experience with a framed photo gallery, four secret notes, a song from your own music folder, a birthday cake and a letter that rises from a 3D envelope.</p><div class="seal">✦</div><div class="row" style="justify-content:center"><button class="btn" id="start">Create my surprise →</button></div>`,0);$('#start').onclick=()=>build(0)}
function build(s){$('#tag').textContent='Personalise your surprise';if(s===0){show(`<div class="k">Creator · Step 1 of 5</div><h2 class="h">Their memories,<br>beautifully framed.</h2><div class="two"><div class="field"><label>Their name</label><input id="name" maxlength="60" value="${esc(data.name)}"></div><div class="field"><label>Your name / nickname</label><input id="from" maxlength="60" value="${esc(data.from)}"></div></div><div class="field"><label>Choose multiple photos from your computer or phone</label><input id="photos" type="file" accept="image/*" multiple><p class="note">Choose up to 5 photos. They will appear in a gallery with a decorative gold-and-rose frame. Images are resized for the share link.</p><div id="photoPreviews" class="small">${(data.photos||[]).length} photo(s) selected</div></div><div class="field"><label>Caption for your photos</label><input id="caption" maxlength="140" value="${esc(data.caption)}"></div><div class="row"><button class="btn" id="next">Next: Four little notes →</button></div>`,1);$('#photos').onchange=async e=>{let files=[...e.target.files].slice(0,5);try{data.photos=[];for(let f of files)data.photos.push(await compressPhoto(f));$('#photoPreviews').textContent=data.photos.length+' photo(s) ready';}catch(err){alert('One of the photos could not be read. Try a JPG or PNG.')}};$('#next').onclick=()=>{data.name=$('#name').value||'My love';data.from=$('#from').value||'Your person';data.caption=$('#caption').value;build(1)}}
else if(s===1){show(`<div class="k">Creator · Step 2 of 5</div><h2 class="h">Four balloons.<br>Four things from your heart.</h2><p class="p">Each balloon will burst when tapped and reveal its own message.</p>${data.notes.map((v,i)=>`<div class="field"><label>Love note ${i+1}</label><textarea id="n${i}" maxlength="420">${esc(v)}</textarea></div>`).join('')}<div class="row"><button class="btn alt" id="back">← Back</button><button class="btn" id="next">Choose your song →</button></div>`,2);$('#back').onclick=()=>build(0);$('#next').onclick=()=>{data.notes=data.notes.map((_,i)=>$('#n'+i).value);build(2)}}
else if(s===2){show(`<div class="k">Creator · Step 3 of 5</div><h2 class="h">Choose a song<br>from your own folder.</h2><p class="p">Pick an MP3 or other audio file saved on your device. The recipient can play your chosen song during the surprise.</p><div class="field"><label>Select your music file</label><input id="musicFile" type="file" accept="audio/*"><p class="note">For a shareable link, choose a short MP3 under 400 KB (roughly a short clip). The music is carried inside the personalised link; larger files can make links too long for messaging apps.</p><div id="musicStatus" class="small">${data.musicName?'Selected: '+esc(data.musicName):'No personal song selected yet.'}</div></div><div class="row"><button class="btn alt" id="preview" ${data.musicData?'':'disabled'}>▶ Preview song</button><button class="btn alt" id="stop">■ Stop</button></div><div class="row"><button class="btn alt" id="back">← Back</button><button class="btn" id="next">Choose cake →</button></div>`,3);$('#musicFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>400*1024){alert('This file is larger than 400 KB. Please choose a shorter/smaller MP3 so the share link remains manageable.');e.target.value='';return}try{data.musicData=await readFile(f);data.musicName=f.name;$('#musicStatus').textContent='Selected: '+f.name+' ('+Math.round(f.size/1024)+' KB)';$('#preview').disabled=false}catch(err){alert('Could not read this audio file. Please try another file.')}};$('#preview').onclick=()=>{let a=new Audio(data.musicData);a.play().catch(()=>alert('Tap preview again to allow audio.'));audio=a};$('#stop').onclick=stopMusic;$('#back').onclick=()=>{stopMusic();build(1)};$('#next').onclick=()=>{stopMusic();build(3)}}
else if(s===3){show(`<div class="k">Creator · Step 4 of 5</div><h2 class="h">A birthday cake<br>and your letter.</h2><p class="p">Choose the cake and write the words you want them to keep.</p>${['Red velvet ❤️','Chocolate 🍫','Strawberry 🍓','Vanilla 🌼','Black forest 🍒','Surprise me 🎁'].map(x=>`<label class="choice"><input type="radio" name="cake" value="${x}" ${data.cake===x?'checked':''}> ${x}</label>`).join('')}<div class="field"><label>Your birthday letter</label><textarea id="letter" style="min-height:190px">${esc(data.letter)}</textarea></div><div class="row"><button class="btn alt" id="back">← Back</button><button class="btn" id="next">Create share link →</button></div>`,4);$('#back').onclick=()=>build(2);$('#next').onclick=()=>{data.cake=document.querySelector('[name=cake]:checked')?.value||'Red velvet';data.letter=$('#letter').value;build(4)}}
else{let url=location.href.split('#')[0]+'#'+encode(data);show(`<div class="k">Creator · Step 5 of 5</div><h2 class="h">Your love story is ready. ✦</h2><p class="p">Copy this personalised link and send it to your special person.</p>${renderGallery()}<div class="field"><label>Personalised share link</label><textarea id="share" readonly style="min-height:100px">${esc(url)}</textarea></div><p class="note">The photos, song and messages are encoded in this link, not encrypted. Anyone with the link can view them. The link may be long when media is included; use a short MP3 and no more than five photos.</p><div class="row"><button class="btn alt" id="back">← Edit</button><button class="btn" id="copy">Copy share link</button><button class="btn gold" id="test">Preview recipient journey →</button></div><p class="small" id="status"></p>`,5);wireGallery();$('#back').onclick=()=>build(3);$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(url);$('#status').textContent='Copied! Send this personalised link by WhatsApp or Instagram.'}catch(e){$('#share').select();$('#status').textContent='Select and copy the link.'}};$('#test').onclick=()=>{location.hash=encode(data);gift=data;stage=0;popped=[];recipient()}}}
function recipient(){ $('#tag').textContent='A surprise for '+gift.name;if(stage===0){show(`<div style="text-align:center;padding:24px 0"><div class="k">Someone made this just for you</div><div class="seal">♥</div><h1 class="h">Happy Birthday,<br>${esc(gift.name)}.</h1><p class="p" style="margin:0 auto">A little birthday adventure, wrapped in memories and made with a lot of love.</p><button class="btn" id="go" style="margin-top:22px">Begin your surprise →</button></div>`,1);$('#go').onclick=()=>{stage++;recipient()}}
else if(stage===1){show(`<div class="k">Chapter 1 · Our little memories</div><h2 class="h">Every picture<br>holds a feeling.</h2>${renderGallery()}<p class="p" style="text-align:center;margin:0 auto">Some moments become memories. Some people make those memories unforgettable.</p><button class="btn" id="go">Discover four little secrets →</button>`,2);wireGallery();$('#go').onclick=()=>{stage++;recipient()}}
else if(stage===2){show(`<div class="k">Chapter 2 · Pop a little love</div><h2 class="h">Four balloons.<br>Tap to discover.</h2><p class="p">Each balloon is hiding a message. Pop all four to unlock the next surprise.</p><div class="balloons">${gift.notes.map((_,i)=>`<button class="balloon" data-i="${i}"><span>POP ME</span></button>`).join('')}</div><div class="reveal" id="reveal">Your first little note is waiting inside a balloon. ♡</div><p class="small" id="count" style="text-align:center">0 of 4 notes revealed</p><div class="row" style="justify-content:center"><button class="btn" id="go" disabled>Continue →</button></div>`,3);document.querySelectorAll('.balloon').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;b.classList.add('popped');b.disabled=true;$('#reveal').textContent=gift.notes[i];popped.push(i);$('#count').textContent=popped.length+' of 4 notes revealed';confetti();if(popped.length===4)$('#go').disabled=false});$('#go').onclick=()=>{stage++;recipient()}}
else if(stage===3){show(`<div class="k">Chapter 3 · A song from the heart</div><h2 class="h">This melody<br>is your little soundtrack.</h2><div class="seal">♫</div><p class="p" style="text-align:center;margin:0 auto">${gift.musicName?'A song chosen just for you: <b>'+esc(gift.musicName)+'</b>':'A quiet moment, made just for you.'}</p><div class="row" style="justify-content:center"><button class="btn" id="play" ${gift.musicData?'':'disabled'}>▶ Play our song</button><button class="btn alt" id="stop">■ Stop</button></div><div class="row" style="justify-content:center"><button class="btn" id="go">Make a birthday wish →</button></div>`,4);$('#play').onclick=playMusic;$('#stop').onclick=stopMusic;$('#go').onclick=()=>{stopMusic();stage++;recipient()}}
else if(stage===4){show(`<div class="k">Chapter 4 · Make a wish</div><h2 class="h">A wish as lovely<br>as you are.</h2><div class="cake-stage"><div class="cake3d">🎂</div><div class="candles" id="flames">🕯️ 🕯️ 🕯️</div></div><p class="p" style="text-align:center;margin:0 auto">Your cake flavour: <b>${esc(gift.cake)}</b><br>Close your eyes, make a wish, and blow out the candles.</p><div class="row" style="justify-content:center"><button class="btn gold" id="blow">Blow out candles ✨</button><button class="btn" id="go" disabled>Open your final surprise →</button></div><p class="p" id="wish" style="text-align:center"></p>`,5);$('#blow').onclick=()=>{$('#flames').textContent='✨ ✨ ✨';$('#wish').textContent='May this year bring you everything your heart is wishing for. ❤️';confetti();$('#go').disabled=false};$('#go').onclick=()=>{stage++;recipient()}}
else{show(`<div class="letter-intro"><div class="k">The final chapter · From ${esc(gift.from)}</div><h1 class="h">One last thing<br>for you...</h1><p class="p" style="margin:0 auto">A little letter, sealed with all my love. Tap the envelope to open it.</p></div><div class="envelope-scene"><div class="envelope" id="envelope"><div class="env-back"></div><div class="letter-card"><div class="letter">${esc(gift.letter)}</div><p style="text-align:right;color:#8b315b;font-style:italic">Forever yours, ${esc(gift.from)} ♡</p></div><div class="env-front"></div><div class="env-flap"></div><div class="env-heart">♥</div></div></div><div class="row" style="justify-content:center"><button class="btn gold" id="openLetter">Open my letter 💌</button></div><div class="row" style="justify-content:center"><button class="btn alt hide" id="again">Celebrate again ✨</button></div><p class="p" style="text-align:center;margin:16px auto 0">Happy Birthday, ${esc(gift.name)}. You are loved more than words can say. ❤️</p>`,6);confetti();$('#openLetter').onclick=()=>{$('#envelope').classList.add('open');$('#openLetter').disabled=true;$('#openLetter').textContent='A letter, just for you ❤️';$('#again').classList.remove('hide');confetti()};$('#again').onclick=()=>{stopMusic();stage=0;popped=[];recipient()}}}
if(gift){data=gift;recipient()}else creator();
</script></body></html>
